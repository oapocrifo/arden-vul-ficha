function md(t){const o=[];let lt='',m;
 const inl=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>')
  .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(x,a,h)=>/^(https?:\/\/|mailto:|#|\/)/i.test(h)?`<a href="${h}" target=_blank rel=noopener>${a}</a>`:a);
 const cl=()=>{if(lt){o.push('</'+lt+'>');lt=''}};
 for(const l of esc(t).split('\n')){
  if(m=l.match(/^(#{1,3})\s+(.*)/)){cl();o.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`)}
  else if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){cl();o.push('<hr>')}
  else if(m=l.match(/^\s*[-*+]\s+(.*)/)){if(lt!='ul'){cl();o.push('<ul>');lt='ul'}o.push('<li>'+inl(m[1])+'</li>')}
  else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(lt!='ol'){cl();o.push('<ol>');lt='ol'}o.push('<li>'+inl(m[1])+'</li>')}
  else if(!l.trim())cl();else{cl();o.push('<p>'+inl(l)+'</p>')}}
 cl();return o.join('')}
